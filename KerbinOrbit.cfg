// Kopernicus 255+ can load Kerbin directly in its intended orbit.
@Kopernicus:NEEDS[KcalbelohSystem]:HAS[@KcalbelohSystemSettings:HAS[#DistanceFactor[0],~HomeSwitchEnabled[?rue]]]:AFTER[Kopernicus_Version]
{
    %KcalbelohNativeHomeworldVersion = #$@KOP_VERSION[Kopernicus_Version]/KopernicusVersion$
}

@Kopernicus:HAS[#KcalbelohNativeHomeworldVersion[>254],@Body[Sun]:HAS[#identifier[KcalbelohSystem/KcalbelohCenter]]]:AFTER[Kopernicus_Version]
{
    @Body[Kerbin]:HAS[@Orbit,@PostSpawnOrbit:HAS[#referenceBody[Kerbol],#semiMajorAxis[*]]]
    {
        @Orbit
        {
            %semiMajorAxis = #$../PostSpawnOrbit/semiMajorAxis$
        }
    }

    @Body[Kerbin]:HAS[@Orbit,@PostSpawnOrbit:HAS[#referenceBody[Kerbol]]]
    {
        @Orbit
        {
            %referenceBody = #$../PostSpawnOrbit/referenceBody$
        }
        !PostSpawnOrbit {}
    }
}

@Kopernicus:HAS[#KcalbelohNativeHomeworldVersion[*]]:AFTER[Kopernicus_Version]
{
    !KcalbelohNativeHomeworldVersion = delete
}
